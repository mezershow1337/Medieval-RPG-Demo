# Готовая сборка для Windows: MedievalRPG.exe + assets в zip-архиве.
# На каждый PR — проверка, что всё собирается и тесты проходят.
# На каждый push в main — ещё и релиз с архивом (Releases → Latest) и лаунчером
# MedievalRPGLauncher.exe, который сам ставит и обновляет игру из этого релиза.
name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Проверка описания сборки
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONUTF8: "1"
        run: python tools/release_notes.py --backfill 2 --force --dry-run

      - name: Rust
        run: rustup update stable && rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            launcher -> target

      - name: Тесты
        run: cargo test --release

      - name: Сборка
        run: cargo build --release

      # Лаунчер — отдельный маленький проект: ставит и обновляет игру из Releases.
      - name: Лаунчер
        run: |
          cargo test --release --manifest-path launcher/Cargo.toml
          cargo build --release --manifest-path launcher/Cargo.toml

      - name: Упаковка
        shell: pwsh
        run: |
          $dir = "MedievalRPG"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target/release/medieval_rpg.exe "$dir/MedievalRPG.exe"
          Copy-Item launcher/target/release/MedievalRPGLauncher.exe "$dir/MedievalRPGLauncher.exe"
          Copy-Item launcher/target/release/MedievalRPGLauncher.exe MedievalRPGLauncher.exe
          Copy-Item -Recurse assets "$dir/assets"
          Copy-Item "dist/README-Как-играть.txt" "$dir/"
          Compress-Archive -Path $dir -DestinationPath MedievalRPG-windows.zip -CompressionLevel Optimal
          "{0:N1} МБ" -f ((Get-Item MedievalRPG-windows.zip).Length / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: MedievalRPG-windows
          path: |
            MedievalRPG-windows.zip
            MedievalRPGLauncher.exe
          compression-level: 0

      # Что нового с прошлой сборки: PR со ссылками и пункты «для игрока»
      # (см. docs/release-notes/README.md). Если GitHub API не ответил — короткое описание.
      - name: Что нового
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONUTF8: "1"
        run: |
          python tools/release_notes.py --tag "build-${{ github.run_number }}" --sha "${{ github.sha }}" --out release-notes.md \
            || printf '%s\n' "Распакуй архив и запусти MedievalRPG.exe — откроется меню «Создать игру / Подключиться»." \
                 "Подробности в README-Как-играть.txt внутри архива." > release-notes.md
          cat release-notes.md

      - name: Релиз
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Сборка для Windows №${{ github.run_number }}
          body_path: release-notes.md
          files: |
            MedievalRPG-windows.zip
            MedievalRPGLauncher.exe
          make_latest: true

      # Дописывает описание прошлым сборкам, у которых его ещё нет.
      - name: Описания прошлых сборок
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONUTF8: "1"
        run: python tools/release_notes.py --backfill 12
